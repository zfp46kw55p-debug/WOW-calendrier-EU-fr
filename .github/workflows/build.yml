name: Générer le calendrier WoW

on:
  push:
    branches:
      - main
      
    paths:
      - "data/**/*.json"
      - "scripts/**/*.py"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le calendrier
        run: python scripts/build.py

      - name: Commit automatique si le calendrier change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour automatique du calendrier"
          file_pattern: wow-eu.ics
